# Fires Cursor's "Expanded Combat Bug issue triage" automation when:
# - the `bug` label is added
# - a bug issue's title or body is edited
# - someone comments on a bug issue that still has more info needed
#
# Comments are ignored once triage is complete (no more info needed label).
# Comments that contain the marker expanded-combat-bug-triage are also skipped
# so the automation's own replies do not loop. Add that marker to every Cursor comment.
#
# Requires repo secrets CURSOR_WEBHOOK_URL and CURSOR_WEBHOOK_KEY.
name: Cursor bug issue triage

on:
  issues:
    types: [labeled, edited]
  issue_comment:
    types: [created, edited]

jobs:
  notify-cursor:
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'bug') &&
      (
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'bug') ||
        (github.event_name == 'issues' && github.event.action == 'edited') ||
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.issue.labels.*.name, 'more info needed') &&
          github.event.comment.user.type != 'Bot' &&
          !contains(github.event.comment.body, 'expanded-combat-bug-triage')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: none
    concurrency:
      group: cursor-bug-triage-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: POST issue to Cursor webhook
        uses: actions/github-script@v8
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_WEBHOOK_KEY }}
        with:
          script: |
            const url = process.env.WEBHOOK_URL;
            const key = process.env.WEBHOOK_KEY;
            if (!url || !key) {
              core.setFailed('Set repository secrets CURSOR_WEBHOOK_URL and CURSOR_WEBHOOK_KEY from the Cursor automation webhook.');
              return;
            }

            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const payload = {
              event_name: context.eventName,
              issue_number: issue.number,
              issue_title: issue.title,
              issue_body: issue.body || '',
              issue_url: issue.html_url,
              issue_author: issue.user && issue.user.login,
              labels: (issue.labels || []).map((label) => label.name),
              action: context.payload.action,
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment ? comment.id : null,
              comment_author: comment && comment.user ? comment.user.login : null,
              comment_body: comment ? comment.body : null,
            };

            const response = await fetch(url, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(payload),
            });

            const text = await response.text();
            if (!response.ok) {
              core.setFailed(`Cursor webhook returned ${response.status}: ${text}`);
              return;
            }

            core.info(`Notified Cursor for issue #${issue.number} (${context.eventName}.${context.payload.action})`);
